schema_version: "1.0"

extension:
  id: "csdd"
  name: "CSDD — Controlled Spec-Driven Development"
  version: "1.2.1"
  description: "把治理规范、门禁、模板安装到已有仓库；第三方扩展按清单可选安装，默认不装。"
  author: "CSDD"
  license: "MIT"
  category: "process"
  effect: "read-write"
  repository: "https://github.com/yuansanche/csdd"
  homepage: "https://github.com/yuansanche/csdd"

requires:
  speckit_version: ">=1.1.3"

provides:
  commands:
    - name: "speckit.csdd.install"
      file: "commands/csdd.install.md"
      description: "把 CSDD 治理层安装到当前仓库：默认预演，冲突不覆盖，装完自检"
    - name: "speckit.csdd.verify"
      file: "commands/csdd.verify.md"
      description: "校验已安装的治理层与包内 payload 是否一致，并跑门禁自检"
    - name: "speckit.csdd.extensions"
      file: "commands/csdd.extensions.md"
      description: "按清单查看或安装第三方扩展；无哈希的组件拒绝安装"
    - name: "speckit.csdd.navigate"
      file: "commands/csdd.navigate.md"
      description: "在新增模块、新建文件或实现新功能之前使用：只读汇总现有架构地图与技术栈，先做复用检查再动手"
    - name: "speckit.csdd.ci"
      file: "commands/csdd.ci.md"
      description: "为项目搭建或补全 CI：跑 CSDD 门禁，并按需加入 blueprint-index 漂移检查"
    - name: "speckit.csdd.discover"
      file: "commands/csdd.discover.md"
      description: "为存量项目建立 BrownKit 证据树（init、scan、discover），让 enrich 等钩子有内容可读"
    - name: "speckit.csdd.hooks"
      file: "commands/csdd.hooks.md"
      description: "查看或切换扩展钩子的自动、询问模式（如 specify 前后自动调用 enrich 与 v-model requirements）"
    - name: "speckit.csdd.prepare"
      file: "commands/csdd.prepare.md"
      description: "specify 之前自动准备证据树：没有就建，已过期就补，已就绪就跳过；失败不挡住 specify"

hooks:
  before_specify:
    command: "speckit.csdd.prepare"
    optional: false
    priority: 5
    prompt: "准备 BrownKit 证据树？"
    description: "specify 之前确保 BrownKit 证据树存在且不过期，让 enrich 有内容可读"

tags: ["governance", "quality-gate", "csdd"]
